name: frontend

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/**'
      - 'frontend/**'
  push:
    branches:
      - 'master'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack (pnpm 9.15.9: version fijada por la receta de build)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Setup pnpm
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install npm modules
        run: pnpm i
        working-directory: frontend

      - name: Run prettier, lint, jest checks
        run: pnpm test
        working-directory: frontend
